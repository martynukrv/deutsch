name: Deutsch Browser Smoke Tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Import verified voice recordings
        run: python3 scripts/import_voice.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser checks
        run: |
          node .github/tests/browser-smoke.cjs
          node .github/tests/profiles.cjs
          node .github/tests/progress.cjs
          node .github/tests/adaptive.cjs
          node .github/tests/native-scenes.cjs
          node .github/tests/village.cjs
          node .github/tests/market.cjs
          node .github/tests/residents.cjs
          node .github/tests/expedition-team.cjs
          node .github/tests/lesson-cycle-unit.cjs
          node .github/tests/island-lessons.cjs
          node .github/tests/shadowing.cjs
          node .github/tests/greetings.cjs
          node .github/tests/inline-audio.cjs
          node .github/tests/fox-conversation.cjs
          node .github/tests/karl-conversation.cjs
          node .github/tests/journey.cjs
          node .github/tests/learning-flow.cjs
          node .github/tests/review.cjs
          node .github/tests/lessons.cjs
      - name: Audit published GitHub Pages
        run: node .github/tests/published-audit.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deutsch-browser-screenshots
          path: audit-screenshots/
          if-no-files-found: ignore
