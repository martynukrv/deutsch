name: Import Original Artwork
on:
  push:
    branches: [main]
    paths:
      - 'audio-inbox/**'
      - 'audio-sources/**'
      - 'art-inbox/**'
      - 'scripts/**'
      - 'assets/illustrations/**'
      - 'index.html'
      - '.github/workflows/import-art.yml'
      - '.github/tests/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: artwork-import-main
  cancel-in-progress: false
jobs:
  import-art:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - name: Validate and import approved originals
        run: python3 scripts/import_art.py
      - name: Validate and import verified voice recordings
        run: python3 scripts/import_voice.py
      - name: Test import failures and original bytes
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify artwork bindings and mobile layouts
        run: node .github/tests/artwork.cjs
      - name: Verify app behavior
        run: |
          node .github/tests/browser-smoke.cjs
          node .github/tests/profiles.cjs
          node .github/tests/review.cjs
          node .github/tests/lessons.cjs
          node .github/tests/first-lesson.cjs
          node .github/tests/full-course.cjs
          node .github/tests/course-art.cjs
          node .github/tests/progress.cjs
          node .github/tests/adaptive.cjs
          node .github/tests/native-scenes.cjs
          node .github/tests/village.cjs
          node .github/tests/market.cjs
          node .github/tests/residents.cjs
          node .github/tests/expedition-team.cjs
          node .github/tests/learning-flow.cjs
      - name: Verify selectable vocabulary practice
        run: node .github/tests/vocab-modes.cjs
      - name: Verify recorded audio playback
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node .github/tests/voice-recordings.cjs
          node scripts/audit_all_audio.cjs --decode --require-whole
      - name: Commit validated artwork and bindings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The audit timestamp is runtime output, not an asset change.
          git restore -- audio/recording/all-audio-audit-20261018.json
          git add assets/ audio/
          if ! git diff --cached --quiet; then
            git commit -m "Import validated artwork, voice recordings and exact bindings"
            git push
          fi
      - name: Stage public site
        run: |
          mkdir _site
          cp index.html _site/
          cp -r assets audio _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Publish validated site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Verify published artwork and vocabulary practice
        env:
          ART_SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node .github/tests/artwork.cjs
          node .github/tests/vocab-modes.cjs
          node .github/tests/voice-recordings.cjs
          node .github/tests/lessons.cjs
          node .github/tests/first-lesson.cjs
          node .github/tests/full-course.cjs
          node .github/tests/course-art.cjs
          node .github/tests/progress.cjs
          node .github/tests/adaptive.cjs
          node .github/tests/native-scenes.cjs
          node .github/tests/village.cjs
          node .github/tests/market.cjs
          node .github/tests/residents.cjs
          node .github/tests/expedition-team.cjs
          node .github/tests/learning-flow.cjs
